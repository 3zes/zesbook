            <p><strong>1. La nation comme communauté historico-symbolique</strong><br>Benedict Anderson (<em>Imagined Communities</em>, 1983) décrit la nation comme une "communauté imaginée". Cette reconnaissance repose sur des symboles partagés, une mémoire commune, et une langue. Or, ces éléments n’existent que s’ils sont transmis — comme les recherches sur le <em>mātauranga Māori</em>.</p>
            <p><strong>2. Le rôle de la transmission</strong><br>La transmission prend diverses formes : langue, rites, valeurs, mémoire. Elle socialise les individus au sein du groupe national. C’est ce qui rend la nation vivante.</p>
            <p><strong>3. Peuple vs Nation</strong><br>Un peuple existe dans le présent. Une nation s’étend dans le temps. Elle relie les générations passées, présentes et futures.</p>
            <p><strong>4. Fragilité sans transmission</strong><br>Quand les mécanismes de transmission se brisent (migrations, acculturation), la nation s’effrite. À l’inverse, les diasporas juive ou arménienne montrent qu’une nation peut exister sans État, grâce à la transmission.</p>
            <p><strong>Conclusion</strong><br>La transmission n’est pas un outil de conservation : c’est l’acte fondateur de la nation. Elle inscrit un peuple dans la durée.</p>
            <p><strong>Références complémentaires</strong><br>
            • Anderson, B. (1983). <em>Imagined Communities</em><br>
            • Halbwachs, M. (1950). <em>La Mémoire collective</em><br>
            • Appadurai, A. (1996). <em>Modernity at Large</em><br>
            • Safran, W. (1991). <em>Diasporas in Modern Societies</em><br>
            • Renan, E. (1882). <em>Qu’est-ce qu’une nation ?</em>
            </p>
          </div>
        `

          contentContainer.innerHTML = contentMap[age][continent]();
